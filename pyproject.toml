[project]
name = "colorcatcher"
version = "0.2.0"
description = "Local industrial indicator illumination monitor"
authors = [{name = "Denis Laskov"}]
requires-python = ">=3.12,<3.15"
readme = "README.md"
dependencies = [
    "opencv-python>=4.10,<6",
    "numpy>=2,<3",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"
